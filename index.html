<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Góc ôn tập của lớp</title>
<style>
:root{--bg:#f7f5ef;--card:#fffdf8;--ink:#12263a;--muted:#4a5a6a;--line:#ddd8ca;--accent:#137a74}
@media (prefers-color-scheme:dark){:root{--bg:#10202e;--card:#172b3b;--ink:#eef2f5;--muted:#a9bccb;--line:#2a4256;--accent:#4fc3bb}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
main{max-width:960px;margin:0 auto;padding:32px 20px 56px}
h1{font-size:clamp(1.7rem,4vw,2.4rem);margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
a.card:hover,a.card:focus-visible{border-color:var(--accent);outline:none}
.card b{display:block;font-size:1.05rem;margin-bottom:4px}
.card span{color:var(--muted);font-size:.92rem}
footer{margin-top:36px;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Góc ôn tập của lớp</h1>
<p class="sub">Chọn môn rồi học ngay trên điện thoại hay máy tính.</p>
<div class="grid">
<a class="card" href="Dia-chat-kien-truc-hoc-tap.html"><b>Địa chất kiến trúc</b><span>Học tương tác</span></a>
<a class="card" href="Khoa%20h%E1%BB%8Dc%20d%E1%BB%AF%20li%E1%BB%87u.html"><b>Khoa học dữ liệu</b><span>Học tương tác</span></a>
</div>
<footer>Tiến độ học được lưu ngay trên trình duyệt của bạn, nên hãy dùng cùng một thiết bị và trình duyệt để xem lại.</footer>
</main>
</body>
</html>
